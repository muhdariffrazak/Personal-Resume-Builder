# Skill domains. `tag` is what data/variants.yaml selects on (skills: {include: [tags]});
# domains render in this file's order. Condensed on 2026-10-31 from reviewer feedback
# (5-7 lines, strongest tools first), then trimmed again the same day to drop items that
# repeat a bullet (generative models, model benchmarking, H200 clusters, Marlin firmware,
# quadcopter design, UAV aeroacoustics) or are generic labels (CNNs, Vision Transformers,
# autonomous mobile robots, Embedded C/C++). Every entry is backed by a bullet or certificate.
# Dropped then as generic or unevidenced: Embodied AI, Multimodal ML, DNNs, Reinforcement
# Learning, Zero-shot Learning, VIO, UAV Flight Testing, ArduPilot, IoT items,
# Experimental Design, Test & Validation, Hardware Prototyping, OpenAPI, Zustand, WSL, uv,
# Dev Containers, ONNX Runtime, Agile/Scrum, Java, C#, and the overlapping
# engineering-data phrases. Earlier drops (RULES.md §3): MATLAB, Excel, Predictive
# Maintenance, Digital Twin, Smart Manufacturing, "AI-assisted tools".
- domain: "Languages"
  tag: languages
  entries:
    - "Python (NumPy, Pandas)"
    - "C/C++"
    - "TypeScript"
  # Condensed (one-page) variants fold the software-infra line in here and select only this
  # domain of the two; `short_domain` renames the line to match.
  short_domain: "Languages & Software"
  short_entries: ["Python", "C/C++", "TypeScript", "Docker", "SLURM", "CUDA", "Linux", "Git", "FastAPI", "React", "WebSockets"]

- domain: "Machine Learning & Vision"
  tag: ai-ml
  entries:
    - "PyTorch"
    - "TensorFlow/Keras"
    - "Hugging Face Transformers"
    - "OpenCV"
    - "LSTMs"
    - "YOLO"
    - "optical flow (RAFT)"
    - "segmentation (SAM 2)"
    - "point tracking (CoTracker)"
  # One-line version for condensed (one-page) variants.
  short_entries: ["PyTorch", "TensorFlow/Keras", "Hugging Face", "OpenCV", "YOLO", "LSTMs", "RAFT", "SAM 2", "CoTracker"]

- domain: "Robotics & UAV"
  tag: robotics-embedded
  entries:
    - "ROS"
    - "LiDAR SLAM"
    - "sensor fusion (IMU, wheel odometry)"
    - "PX4/Pixhawk"
  # Condensed (one-page) variants fold the hardware-mechatronics line in here and select
  # only this domain of the two.
  short_domain: "Robotics & Embedded"
  short_entries: ["ROS", "LiDAR SLAM", "sensor fusion", "PX4/Pixhawk", "RTOS", "STM32", "Arduino", "PID control", "PCB design"]  # SOLIDWORKS: shown via the CSWA certification

- domain: "Embedded & Hardware"
  tag: hardware-mechatronics
  entries:
    - "RTOS"
    - "STM32"
    - "Arduino"
    - "PID/closed-loop control"
    - "PCB design"
    - "SOLIDWORKS (CAD)"

- domain: "Infrastructure & Software"
  tag: software-infra
  entries:
    - "Docker"
    - "SLURM"
    - "CUDA"
    - "Linux"
    - "Git"
    - "FastAPI"
    - "React"
    - "WebSockets"

# Generic engineering-data block, sourced from HighImpactKeywords.md. Shown only on
# applied-ml-cv and embedded-firmware; the agency send-outs read weaker with it.
- domain: "Data & Analysis"
  tag: engineering-data
  entries:
    - "scikit-learn"
    - "time-series and sensor data analysis"
    - "data visualization"
    - "PLCs"
