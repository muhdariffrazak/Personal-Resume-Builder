# --- Standalone projects (previously the flat "Specialized Projects Database") ---

- id: capstone-quiet-quadcopter
  title: "Capstone (MET4004): Acoustic Noise Reduction for Drones"
  role: "Project Lead, Software & Electronics"
  sponsor: "Sponsored by KLASS"
  dates: "Aug 2026 – Apr 2027"
  tags: [robotics-embedded, hardware-mechatronics, leadership, uav]
  bullets:
    - text: "Leading a 3-person team, working from an approved proposal, to build a proof-of-concept indoor drone for end user MHA that is harder to detect by sound, targeting a 78 dBA ceiling at a 1 m reference during steady hover, 10-minute hover endurance, and a 370 mm square airframe envelope."
    - text: "Selected a low-noise propulsion stack: 5-inch injection-molded toroidal propellers, custom ducts with acoustic lining and serrated trailing edges, 1300 KV low-RPM motors, and AM32 ESC PWM frequency tuning to shift tonal whine into less perceptible bands."
    - text: "Specified the avionics and power architecture (Holybro Pixhawk 6C Mini, PM02 V2 power module, dedicated 150 A power distribution board), sized to preserve control headroom for manually piloted indoor flight."
    - text: "Planned the acoustic validation to the Von Karman Institute four-microphone methodology with TU Berlin distance normalization to a 1 m reference; the tests will benchmark against HKUST's 90.52 dBA commercial quadcopter baseline and VKI's DJI Phantom 3 SE measurements."

- id: trolley-robot
  title: "Autonomous Airport Trolley Return Robot (SIT–DigiPen Coursework)"
  role: "Firmware & Perception"
  dates: null
  tags: [robotics-embedded, hardware-mechatronics]
  bullets:
    - text: "Built LiDAR-based perception in C++ and ROS for a robot that autonomously returns airport trolleys, integrating obstacle detection, SLAM mapping, and localization with IMU and wheel-odometry sensor fusion on an onboard computer; the robot completed the final demo task."
    - text: "Developed RTOS firmware on an STM32F7 microcontroller with concurrent tasks for obstacle detection and joystick control, and a custom serial protocol linking it to ROS for reliable motor control."

- id: custom-3d-printer
  title: "Custom 3D Printer Development"
  dates: "2019"
  tags: [hardware-mechatronics]
  bullets:
    - text: "Built a custom 3D printer from off-the-shelf modules as a personal project and extended its Marlin firmware in C++ with auto bed levelling and filament runout detection, which improved first-layer adhesion and print quality and cut failed prints."

