# Professional experience. Each bullet has its own id + tags so variants.yaml can
# cherry-pick individual bullets (mirrors how Checklist.md tailors bullet-by-bullet).
# Bullets referenced from data/projects.yaml via `ref: "<experience_id>:<bullet_id>"`
# are the authoritative text — projects.yaml does not duplicate the wording.
#
# Numbers policy: only figures traceable to a verified source appear here. Where a
# bullet previously carried an invented placeholder metric (`___`) or an unverified
# "+50%", the claim was removed rather than guessed at. See README "Open items".
- id: klass
  company: "KLASS Engineering and Solutions"
  role: "Machine Learning & Fullstack Engineer (Intern)"
  location: null
  dates: "Sep 2025 – Aug 2026"
  tags: [ai-ml, computer-vision, software-fullstack, infra-cloud]
  bullets:
    - id: klass-benchmarking
      text: "Reproduced and benchmarked state-of-the-art AI-generated video and audio detectors (NSG-VD, D3, ReStraV, SpeechForensics) on SLURM-based HPC to assess detection capability against AI-generated media as a public-safety threat, achieving 90.03 AUROC on the NSG-VD replication."
      tags: [ai-ml, computer-vision]
    - id: klass-video-analytics
      text: "Ran ablation studies integrating optical flow (RAFT), segmentation (SAM 2), and point tracking (CoTracker) to test whether physical-motion signals in video sequences can distinguish AI-generated content, finding mixed evidence of a usable signal."
      tags: [ai-ml, computer-vision]
    - id: klass-data-generation
      text: "Engineered a data generation pipeline chaining video extension (Wan2.2), voice cloning (Chatterbox), and lip-sync (LatentSync) models to curate a balanced 1,200-video real/fake dataset, used to compare all four detectors consistently and to test models at small scale before committing larger compute."
      tags: [ai-ml]
    - id: klass-av-sync
      text: "Evaluated audio-visual synchronization as a deepfake detection signal, selecting a ~0.3 operating threshold through ROC analysis."
      tags: [ai-ml, computer-vision]
    - id: klass-hpc
      text: "Managed GPU-accelerated experimentation on shared SLURM clusters (NVIDIA H200 nodes) via Docker containers, running sanity-check protocols on custom validation splits that caught pipeline errors before committing to training and synthetic-deepfake generation runs of up to 5 hours each."
      tags: [infra-cloud, ai-ml]
    - id: klass-fullstack
      text: "Built React frontend components and FastAPI backend services with WebSockets for real-time streaming responses, deploying multi-model AI endpoints for a company-wide internal AI chatbot platform that gave staff a secure alternative to public AI tools, with search across internal documents."
      tags: [software-fullstack]

