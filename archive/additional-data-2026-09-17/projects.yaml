# --- Standalone projects (previously the flat "Specialized Projects Database") ---

- id: capstone-quiet-quadcopter
  title: "Capstone (MET4004) — Acoustic Noise Reduction for Drones"
  role: "Project Lead — Software & Electronics"
  sponsor: "Sponsored by KLASS"
  dates: "Aug 2026 – Apr 2027"
  tags: [robotics-embedded, hardware-mechatronics, leadership, uav]
  bullets:
    - text: "Leading a 3-person team to deliver a proof-of-concept quiet indoor drone for end user MHA, targeting a 78 dBA ceiling at a 1 m reference during steady hover, 10-minute hover endurance, and a 370 mm square airframe envelope, with the project proposal approved."
    - text: "Owning the software and electronics workstream, selecting a low-noise propulsion stack of 5-inch injection-molded toroidal propellers, custom ducts with acoustic lining and serrated trailing edges, 1300 KV low-RPM motors, and AM32 ESC PWM frequency tuning to shift tonal whine into less perceptible bands."
    - text: "Specified the avionics and power architecture (Holybro Pixhawk 6C Mini, PM02 V2 power module, dedicated 150 A power distribution board), yielding a derated 3.3:1 thrust-to-weight ratio at 1,200 g all-up weight to preserve control headroom for manually piloted indoor flight."
    - text: "Designed the acoustic validation plan to the Von Karman Institute four-microphone methodology with TU Berlin distance normalization to a 1 m reference, to benchmark directly against HKUST's 90.52 dBA commercial quadcopter baseline and VKI's DJI Phantom 3 SE measurements."
    - text: "Specified psychoacoustic post-processing in Python (MoSQITo) under both Zwicker (ISO 532-1) and Moore–Glasberg (ISO 532-2) loudness standards to quantify perceived annoyance beyond raw sound-pressure level."

- id: trolley-robot
  title: "Autonomous Trolley Collection Robot (SIT–DigiPen Coursework)"
